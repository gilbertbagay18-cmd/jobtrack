<!DOCTYPE html>
<html lang="en" data-pref="{{ theme }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>JobTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<header><h1><span class="logo">📋</span> Job<span class="grad">Track</span></h1><p>Land the job. Track every step. 🚀</p>{% if session.name %}<details class="menu"><summary><span class="av">{{ session.name[0]|upper }}</span><span class="nm">{{ session.name }}</span><span aria-hidden="true">▾</span></summary>
<div class="menu-list">
<a href="/profile">👤 Profile</a>
<a href="/settings">⚙️ Settings</a>
<a href="/settings#password">🔑 Change password</a>
<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">🚪 Log out</button></form>
</div></details>{% endif %}<button id="install" class="btn" hidden>📲 Install app</button></header>
<div class="box">

{% block content %}{% endblock %}
</div>
{% if session.uid and request.endpoint == 'index' %}<a class="fab" href="/add">+</a>{% endif %}
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
let dp;
const ib = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); dp = e; ib.hidden = false; });
ib.onclick = async () => { dp.prompt(); await dp.userChoice; ib.hidden = true; };
</script>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
<div id="toasts" aria-live="polite"></div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
<h3 id="confirm-title">Are you sure?</h3>
<p id="confirm-msg" class="muted"></p>
<div class="actions"><button type="button" class="btn red" id="confirm-yes">Yes, continue</button><button type="button" class="btn gray" id="confirm-no">Cancel</button></div>
</dialog>
<script type="application/json" id="flash-data">{{ get_flashed_messages()|tojson }}</script>
</body>
</html>
