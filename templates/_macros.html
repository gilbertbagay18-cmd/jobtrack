{% macro pwfield(name, id, label, placeholder="", autocomplete="current-password") %}
<label for="{{ id }}">{{ label }}</label>
<div class="pw">
<input type="password" name="{{ name }}" id="{{ id }}" required autocomplete="{{ autocomplete }}" placeholder="{{ placeholder }}">
<button type="button" class="eye" data-target="{{ id }}" aria-label="Show password" aria-pressed="false">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
</button>
</div>
{% endmacro %}
{% macro loc(l) %}{% if l.lower().startswith(("http://", "https://")) %}<a href="{{ l }}" target="_blank" rel="noopener noreferrer">🔗 Join meeting</a>{% else %}<a href="https://www.google.com/maps/search/?api=1&query={{ l|urlencode }}" target="_blank" rel="noopener noreferrer">📍 {{ l }}</a>{% endif %}{% endmacro %}
